<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0093DD">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Lịch nghỉ phép PEC – Portcoast</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/logo.png" alt="Portcoast" class="logo">
      <div class="app-title"><strong>Lịch nghỉ phép</strong><span id="unitName"></span></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Chức năng"></nav>
    <button class="user-chip" id="userChip" type="button" hidden></button>
  </header>
  <div id="demoBanner" class="demo-banner" hidden></div>

  <main id="main">
    <section class="view" id="view-calendar"></section>
    <section class="view" id="view-form" hidden></section>
    <section class="view" id="view-approve" hidden></section>
    <section class="view" id="view-summary" hidden></section>
    <section class="view" id="view-me" hidden></section>
    <section class="view" id="view-admin" hidden></section>
  </main>

  <div class="overlay" id="login" hidden>
    <form class="login-card" id="loginForm" autocomplete="on">
      <img src="assets/logo.png" alt="Portcoast" class="login-logo">
      <h1>Lịch nghỉ phép</h1>
      <p class="muted" id="loginUnit"></p>
      <label>Mã nhân sự
        <input name="ma" id="loginMa" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required placeholder="VD: ngoc.nhk">
      </label>
      <label>Mật khẩu
        <input name="pin" id="loginPin" type="password" autocomplete="current-password" required placeholder="••••••">
      </label>
      <label class="ck remember"><input type="checkbox" id="loginRemember"> Giữ đăng nhập 30 ngày</label>
      <button class="btn primary block" type="submit" id="loginBtn">Đăng nhập</button>
      <p class="err" id="loginErr"></p>
      <p class="muted small" id="loginHint">Mã nhân sự: tên + chữ đầu họ và tên đệm, không dấu (Nguyễn Hoàng Khánh Ngọc → ngoc.nhk). Lần đầu dùng mật khẩu 123456.</p>
      <div id="demoRoles" class="demo-roles" hidden></div>
    </form>
    <form class="login-card" id="firstPinForm" autocomplete="on" hidden>
      <img src="assets/logo.png" alt="Portcoast" class="login-logo">
      <h1>Đổi mật khẩu</h1>
      <p class="muted" id="firstPinWho"></p>
      <p class="small">Bạn đang dùng mật khẩu mặc định. Hãy đặt mật khẩu riêng (6–32 ký tự) trước khi sử dụng.</p>
      <input type="text" name="username" id="firstPinUser" autocomplete="username" hidden>
      <label>Mật khẩu mới
        <input name="p1" type="password" autocomplete="new-password" required minlength="6" maxlength="32">
      </label>
      <label>Nhập lại mật khẩu mới
        <input name="p2" type="password" autocomplete="new-password" required minlength="6" maxlength="32">
      </label>
      <button class="btn primary block" type="submit" id="firstPinBtn">Đổi mật khẩu và vào</button>
      <p class="err" id="firstPinErr"></p>
      <button class="btn block" type="button" data-act="cancelFirst">Quay lại</button>
    </form>
  </div>

  <div class="overlay" id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="sheet-close" type="button" data-close aria-label="Đóng">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js?v=7"></script>
  <script src="js/logic.js?v=7"></script>
  <script src="js/api.js?v=7"></script>
  <script src="js/app.js?v=7"></script>
</body>
</html>
